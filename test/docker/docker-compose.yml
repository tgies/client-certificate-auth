services:
  backend:
    build:
      context: ../..
      dockerfile: test/docker/backend/Dockerfile
    networks:
      - proxy-net

  # nginx with strict client cert verification (ssl_verify_client on).
  # Host port left ephemeral so the suite is robust against host-side conflicts
  # (some Windows services - e.g. iphlpsvc - claim 8443/8444). Discovered
  # after `docker compose up` via `docker port`.
  nginx-strict:
    image: nginx:1.28.2-alpine
    ports:
      - "443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CERTS_DIR}:/certs:ro
    depends_on:
      - backend
    networks:
      - proxy-net

  # nginx with optional client cert verification (ssl_verify_client optional_no_ca)
  nginx-optional:
    image: nginx:1.28.2-alpine
    ports:
      - "443"
    volumes:
      - ./nginx/nginx-optional.conf:/etc/nginx/nginx.conf:ro
      - ${CERTS_DIR}:/certs:ro
    depends_on:
      - backend
    networks:
      - proxy-net

  # Envoy proxy with XFCC header. Standard config emits Cert= and Chain= -
  # parseXfcc returns at the first Cert= match per Envoy's field order
  # (Hash;Cert;Chain;Subject), so the multi-block Chain bug stays shadowed.
  envoy:
    image: envoyproxy/envoy:v1.37.0
    ports:
      - "443"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ${CERTS_DIR}:/certs:ro
    command: [ "envoy", "-c", "/etc/envoy/envoy.yaml" ]
    depends_on:
      - backend
    networks:
      - proxy-net

  # Envoy with chain-only XFCC config (no Cert= field, only Chain=). Surfaces
  # the parseXfcc multi-block PEM bug that the standard config shadows.
  envoy-chain-only:
    image: envoyproxy/envoy:v1.37.0
    ports:
      - "443"
    volumes:
      - ./envoy/envoy-chain-only.yaml:/etc/envoy/envoy.yaml:ro
      - ${CERTS_DIR}:/certs:ro
    command: [ "envoy", "-c", "/etc/envoy/envoy.yaml" ]
    depends_on:
      - backend
    networks:
      - proxy-net

  # Traefik proxy with PassTLSClientCert middleware
  traefik:
    image: traefik:v3.6.7
    ports:
      - "443"
    volumes:
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - ${CERTS_DIR}:/certs:ro
    depends_on:
      - backend
    networks:
      - proxy-net

  # Traefik with optional client auth (VerifyClientCertIfGiven) and a headers
  # middleware that clears X-Forwarded-Tls-Client-Cert ahead of PassTLSClientCert,
  # which never removes a client-supplied header on its own.
  traefik-optional:
    image: traefik:v3.6.7
    ports:
      - "443"
    volumes:
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic-optional.yaml:/etc/traefik/dynamic.yaml:ro
      - ${CERTS_DIR}:/certs:ro
    depends_on:
      - backend
    networks:
      - proxy-net

networks:
  proxy-net:
    driver: bridge
