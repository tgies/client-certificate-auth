version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/examples/e2e-mtls"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    versioning-strategy: "increase-if-necessary"
    ignore:
      # 30.5.2 breaks HTTPS setup between suites on Node 20; 30.4.2 passes.
      - dependency-name: "jest"
        versions: ["30.5.2"]
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-dev-tools:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-production:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/examples/e2e-mtls"
    target-branch: "maint/1.x"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
      semver-major-days: 14

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Chicago"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
