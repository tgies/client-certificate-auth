name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-proxies:
    name: E2E Proxy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run E2E proxy tests
        run: npm run test:e2e

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          echo "=== Container Status ===" > docker-logs.txt
          docker compose -f test/docker/docker-compose.yml ps -a >> docker-logs.txt 2>&1
          echo -e "\n=== Container Logs ===" >> docker-logs.txt
          docker compose -f test/docker/docker-compose.yml logs --no-color >> docker-logs.txt 2>&1

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-docker-logs
          path: docker-logs.txt
          retention-days: 7

      - name: Cleanup Docker
        if: always()
        run: docker compose -f test/docker/docker-compose.yml down -v 2>/dev/null || true
