name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-proxies:
    name: E2E Proxy Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run E2E proxy tests
        run: npm run test:e2e

      - name: Dump Docker logs on failure
        if: failure()
        run: |
          echo "=== Container Status ===" > docker-logs.txt
          docker compose -f test/docker/docker-compose.yml ps -a >> docker-logs.txt 2>&1
          echo -e "\n=== Container Logs ===" >> docker-logs.txt
          docker compose -f test/docker/docker-compose.yml logs --no-color >> docker-logs.txt 2>&1

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-docker-logs
          path: docker-logs.txt
          retention-days: 7

      - name: Cleanup Docker
        if: always()
        run: docker compose -f test/docker/docker-compose.yml down -v 2>/dev/null || true
